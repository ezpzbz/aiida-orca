[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiida_orca"
dynamic = ["version"]
description = "AiiDA-Orca plugin"
authors = [
    {name = "Pezhman Zarabadi-Poor", email = "pzarabadip@gmail.com"},
    {name = "Daniel Hollas", email = "danekhollas@gmail.com"}
]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AiiDA",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering"
]

keywords = ["aiida", "orca"]
requires-python = ">=3.9"
dependencies = [
    "aiida-core>=2.1,<3",
    "ase",
    "periodictable"
]

[project.urls]
Home = "https://github.com/pzarabadip/aiida-orca"

[project.entry-points."aiida.calculations"]
"orca.orca" = "aiida_orca.calculations:OrcaCalculation"
"orca.asa" = "aiida_orca.calculations:OrcaAsaCalculation"

[project.entry-points."aiida.parsers"]
"orca_base_parser" = "aiida_orca.parsers:OrcaBaseParser"

[project.entry-points."aiida.workflows"]
"orca.base" = "aiida_orca.workchains:OrcaBaseWorkChain"

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinxcontrib-contentui",
    "sphinxcontrib-details-directive",
    "sphinx-rtd-theme"
]

[dependency-groups]
dev = [
    "pgtest>=1.3",
    "pytest>=7",
    "pytest-cov>=4.0",
    "pytest-regressions>=2.5",
    "pre-commit>=3.5",
    "mypy>=1.5",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "aiida_orca/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["aiida_orca"]

[tool.ruff]
target-version = "py39"
line-length = 120
fix = true
extend-exclude = ["aiida_orca/parsers/cclib"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
show_error_codes = true
check_untyped_defs = true
scripts_are_modules = true
warn_unused_ignores = true
warn_redundant_casts = true
no_warn_no_return = true
show_traceback = true

[tool.pytest.ini_options]
minversion = '6.0'
testpaths = [
    'tests',
]
filterwarnings = [
    'ignore:Creating AiiDA configuration folder.*:UserWarning',
]

[[tool.mypy.overrides]]
module = 'aiida.*'
# can only follow these imports when more of the code is typed
follow_imports = "skip"

[[tool.mypy.overrides]]
module = 'tests.*'
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    'ase.*',
    'circus.*',
    'kiwipy.*',
    'numpy.*',
    'pytz.*',
    'ruamel.*',
    'scipy.*',
    'tabulate.*',
    'tqdm.*',
    'wrapt.*',
    'aiida.*'
]
ignore_missing_imports = true
